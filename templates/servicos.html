<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Serviços</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background:#0f172a; color:#e2e8f0; }
    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <a href="/dashboard" class="text-emerald-400 text-sm mb-6 inline-block">← Dashboard</a>
    
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-white">🎯 Meus serviços</h1>
    </div>
    
    <!-- Novo Serviço Form -->
    <div class="card rounded-2xl p-6 mb-6">
      <h2 class="text-xl font-bold text-white mb-4">Criar novo serviço</h2>
      <form method="POST" action="/servico/novo" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="text" name="nome" placeholder="Nome do serviço" class="bg-slate-700/50 text-white px-4 py-2 rounded-lg" required>
          <input type="number" name="intervalo_padrao" min="1" max="365" value="30" placeholder="Dias" class="bg-slate-700/50 text-white px-4 py-2 rounded-lg">
          <button type="submit" class="bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold">+ Adicionar</button>
        </div>
      </form>
    </div>
    
    <!-- Serviços List -->
    <div class="space-y-3">
      {% if servicos %}
      {% for servico in servicos %}
      <div class="card rounded-2xl p-6 flex justify-between items-center">
        <div>
          <p class="text-white font-semibold">{{ servico.nome }}</p>
          <p class="text-slate-400 text-sm">Intervalo padrão: {{ servico.intervalo_padrao }} dias</p>
        </div>
        <span class="text-emerald-400 text-sm">✓ Ativo</span>
      </div>
      {% endfor %}
      {% else %}
      <p class="text-slate-500">Nenhum serviço criado</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
