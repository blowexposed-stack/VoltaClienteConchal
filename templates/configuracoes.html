<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background:#0f172a; color:#e2e8f0; }
    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
    .input-field { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#f1f5f9; }
  </style>
</head>
<body class="min-h-screen p-4">
  <div class="max-w-2xl mx-auto">
    <a href="/dashboard" class="text-emerald-400 text-sm mb-6 inline-block">← Dashboard</a>
    
    <div class="card rounded-2xl p-8">
      <h1 class="text-3xl font-bold text-white mb-6">⚙️ Configurações</h1>
      
      <form method="POST" action="/configuracoes/atualizar" class="space-y-6">
        <div>
          <label class="text-slate-300 font-semibold">Nome do estabelecimento</label>
          <input type="text" name="nome_estabelecimento" value="{{ user.nome_estabelecimento }}" class="input-field w-full rounded-lg px-4 py-3 mt-2" required>
        </div>
        
        <div>
          <label class="text-slate-300 font-semibold">Tipo de negócio</label>
          <select name="tipo_negocio" class="input-field w-full rounded-lg px-4 py-3 mt-2" required>
            {% for tipo in tipos_negocio %}
            <option value="{{ tipo|lower }}" {% if user.tipo_negocio == tipo|lower %}selected{% endif %}>{{ tipo }}</option>
            {% endfor %}
          </select>
        </div>
        
        <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-lg font-semibold hover:bg-emerald-600 transition">
          💾 Salvar configurações
        </button>
      </form>
      
      <div class="mt-8 pt-8 border-t border-slate-700/50">
        <h2 class="text-xl font-bold text-white mb-4">📊 Status da conta</h2>
        <div class="space-y-3 text-slate-300">
          <p>💎 Plano: <span class="font-semibold capitalize">{{ user.status }}</span></p>
          <p>📅 Trial expira: {{ user.trial_expiry|truncate(10, True) }}</p>
          <p>👤 E-mail: {{ user.email }}</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
