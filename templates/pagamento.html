<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assinar VoltaCliente</title>
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#10b981"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { font-family:'Inter', sans-serif; }
    .brand { font-family:'Syne', sans-serif; }
    body { background:#0f172a; color:#e2e8f0; }
    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
    .btn-mp { background:linear-gradient(135deg,#009ee3,#0070b9); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="card max-w-md w-full rounded-2xl p-7 text-center">
    <div class="w-14 h-14 rounded-2xl bg-emerald-500 mx-auto flex items-center justify-center font-bold text-white mb-5">VC</div>
    <h1 class="brand text-2xl font-800 text-white">Seu teste gratis terminou</h1>
    <p class="text-slate-400 text-sm mt-3">
      Para continuar usando o VoltaCliente Conchal, assine o plano premium recorrente.
    </p>

    <div class="my-6 rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-5">
      <p class="text-slate-400 text-sm">Plano Premium</p>
      <p class="text-3xl font-bold text-white mt-1">{{ valor }}<span class="text-sm text-slate-400">/mes</span></p>
    </div>

    <a href="{{ checkout_url }}" target="_blank" class="btn-mp block rounded-xl py-3 font-semibold text-white">
      Pagar com Mercado Pago
    </a>
    <a href="/logout" class="block mt-4 text-slate-500 text-sm">Sair</a>
  </main>
</body>
</html>
