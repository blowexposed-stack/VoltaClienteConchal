<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Novo Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background:#0f172a; color:#e2e8f0; }
    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
    .input-field { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#f1f5f9; }
    .input-field:focus { outline:none; border-color:#10b981; }
  </style>
</head>
<body class="min-h-screen p-4">
  <div class="max-w-2xl mx-auto">
    <a href="/clientes" class="text-emerald-400 text-sm mb-6 inline-block">← Voltar</a>
     
    <div class="card rounded-2xl p-8">
      <h1 class="text-3xl font-bold text-white mb-6">➕ Adicionar novo cliente</h1>
       
      <form method="POST" class="space-y-4">
        <div>
          <label class="text-slate-300 text-sm font-semibold">Nome do cliente *</label>
          <input type="text" name="nome" class="input-field w-full rounded-lg px-4 py-3 mt-2" placeholder="Seu cliente" required>
        </div>
         
        <div>
          <label class="text-slate-300 text-sm font-semibold">WhatsApp *</label>
          <input type="tel" name="whatsapp" class="input-field w-full rounded-lg px-4 py-3 mt-2" placeholder="(19) 99999-9999" required>
        </div>
         
        <div>
          <label class="text-slate-300 text-sm font-semibold">E-mail</label>
          <input type="email" name="email" class="input-field w-full rounded-lg px-4 py-3 mt-2" placeholder="cliente@email.com">
        </div>
         
        <div>
          <label class="text-slate-300 text-sm font-semibold">Tipo de serviço *</label>
          <select name="tipo_servico" class="input-field w-full rounded-lg px-4 py-3 mt-2" required>
            <option value="">Selecione um serviço</option>
            {% for servico in servicos %}
            <option value="{{ servico.nome }}">{{ servico.nome }}</option>
            {% endfor %}
          </select>
        </div>
         
        <div>
          <label class="text-slate-300 text-sm font-semibold">Intervalo de retorno (dias) *</label>
          
          <div class="grid grid-cols-3 gap-3 mt-2 mb-3">
            <label class="flex items-center gap-2 cursor-pointer input-field rounded-lg px-4 py-3 transition hover:bg-white/10">
              <input type="radio" name="opcao_rapida" value="7" onclick="definirDias(7)" class="w-4 h-4 accent-emerald-500">
              <span class="text-slate-300 text-sm">7 dias</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer input-field rounded-lg px-4 py-3 transition hover:bg-white/10">
              <input type="radio" name="opcao_rapida" value="15" onclick="definirDias(15)" class="w-4 h-4 accent-emerald-500">
              <span class="text-slate-300 text-sm">15 dias</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer input-field rounded-lg px-4 py-3 transition hover:bg-white/10">
              <input type="radio" name="opcao_rapida" value="30" onclick="definirDias(30)" class="w-4 h-4 accent-emerald-500" checked>
              <span class="text-slate-300 text-sm">30 dias</span>
            </label>
          </div>
          
          <input type="number" id="intervalo_real" name="intervalo_retorno" min="1" max="365" value="30"
                 class="input-field w-full rounded-lg px-4 py-3" placeholder="Ou especifique outro valor de dias" required>
        </div>
         
        <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-lg font-semibold hover:bg-emerald-600 transition mt-6">
          ✅ Adicionar cliente
        </button>
      </form>
    </div>
  </div>

  <script>
    function definirDias(valor) {
      document.getElementById('intervalo_real').value = valor;
    }
    
    // Se o usuário digitar manualmente, ajusta ou desmarca os seletores redondos
    document.getElementById('intervalo_real').addEventListener('input', function() {
      const valorAtual = this.value;
      const radios = document.getElementsByName('opcao_rapida');
      
      radios.forEach(radio => {
        if (radio.value === valorAtual) {
          radio.checked = true;
        } else {
          radio.checked = false;
        }
      });
    });
  </script>
</body>
</html>
