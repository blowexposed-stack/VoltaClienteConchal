<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n  <title>Agendar - {{ user.nome_estabelecimento }}</title>\n  <script src=\"https://cdn.tailwindcss.com\"></script>\n  <style>\n    * { font-family: 'Inter', sans-serif; }\n    body { background:linear-gradient(135deg, #0f172a 0%, #1a2a4a 100%); color:#e2e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; }\n    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(10px); }\n    .input-field { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#f1f5f9; }\n    .input-field:focus { outline:none; border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,0.15); }\n    .btn { background:linear-gradient(135deg,#10b981,#059669); cursor:pointer; transition:all 0.3s; }\n    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(16,185,129,0.3); }\n  </style>\n</head>\n<body class=\"p-4\">\n  <div class=\"card rounded-3xl p-8 max-w-md w-full\">\n    <div class=\"mb-8 text-center\">\n      <h1 class=\"text-4xl font-bold text-white mb-2\">📅 Agende seu atendimento</h1>\n      <p class=\"text-slate-400 text-sm\">{{ user.nome_estabelecimento }}</p>\n    </div>\n    \n    <form id=\"formAgendamento\" class=\"space-y-4\">\n      <div>\n        <label class=\"text-slate-300 text-sm font-semibold block mb-2\">Seu nome *</label>\n        <input type=\"text\" name=\"nome\" class=\"input-field w-full rounded-lg px-4 py-3\" placeholder=\"Digite seu nome\" required>\n      </div>\n      \n      <div>\n        <label class=\"text-slate-300 text-sm font-semibold block mb-2\">WhatsApp *</label>\n        <input type=\"tel\" name=\"whatsapp\" class=\"input-field w-full rounded-lg px-4 py-3\" placeholder=\"(19) 99999-0000\" required>\n      </div>\n      \n      <div>\n        <label class=\"text-slate-300 text-sm font-semibold block mb-2\">Serviço desejado *</label>\n        <select name=\"servico\" class=\"input-field w-full rounded-lg px-4 py-3\" required>\n          <option value=\"\">Selecione um serviço</option>\n          <option value=\"corte\">Corte de cabelo</option>\n          <option value=\"barba\">Barba</option>\n          <option value=\"combo\">Corte + Barba</option>\n          <option value=\"outros\">Outro serviço</option>\n        </select>\n      </div>\n      \n      <div>\n        <label class=\"text-slate-300 text-sm font-semibold block mb-2\">Data preferida *</label>\n        <input type=\"date\" name=\"data\" class=\"input-field w-full rounded-lg px-4 py-3\" required>\n      </div>\n      \n      <button type=\"submit\" class=\"btn w-full text-white py-3 rounded-lg font-semibold text-lg mt-6\">\n        ✅ CONFIRMAR AGENDAMENTO\n      </button>\n      \n      <p class=\"text-center text-slate-500 text-xs mt-4\">\n        ✉️ Você receberá uma confirmação no WhatsApp em breve\n      </p>\n    </form>\n  </div>\n\n  <script>\n    document.getElementById('formAgendamento').addEventListener('submit', async (e) => {\n      e.preventDefault();\n      \n      const dados = {\n        nome: document.querySelector('input[name=\"nome\"]').value,\n        whatsapp: document.querySelector('input[name=\"whatsapp\"]').value,\n        servico: document.querySelector('select[name=\"servico\"]').value,\n        data: document.querySelector('input[name=\"data\"]').value\n      };\n      \n      const resposta = await fetch('/api/agendar/{{ slug }}', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(dados)\n      });\n      \n      if (resposta.ok) {\n        alert('✅ Agendamento confirmado! Aguarde nosso contato no WhatsApp.');\n        document.getElementById('formAgendamento').reset();\n      } else {\n        alert('❌ Erro ao agendar. Tente novamente.');\n      }\n    });\n  </script>\n</body>\n</html>\n
